block-material: EMERALD_BLOCK
debug-crops: false
persist-data: true

crops:
  wheat: true
  carrots: true
  potatoes: true
  beetroots: true
  nether_wart: true
  cocoa: true
  melon_stem: true
  pumpkin_stem: true
  sweet_berry_bush: true
  pitcher_crop: true
  torchflower_crop: true

limits:
  max-blocks-per-island: 5

hologram:
  offset-y: 1.5
  update-countdown: true
  update-interval: 1
  scale: 1.0
  lines:
    - "&a&l✦ Regenerador ✦"
    - "&7Tiempo: &b{time_level} &8| &7Radio: &a{radius}"
    - "&7Cultivos: &e{crops_level}"
    - "&8⏳ Próx: &f{next_regen}s"

particles:
  enabled: true
  interval-ticks: 10
  type: END_ROD
  radius: 0.8
  points: 24

menu:
  # Tamaño del inventario: 1-6 filas.
  rows: 1
  title: "&8Mejoras del Regenerador"

  # Cada elemento es completamente configurable.
  # action: UPGRADE_TIME, UPGRADE_RADIUS, UPGRADE_CROPS, TOGGLE_PARTICLES o NONE
  # Placeholders disponibles para mejoras:
  # {level}, {max_level}, {next_level}, {cost}
  # {current_interval}, {next_interval}
  # {current_radius}, {next_radius}
  # {current_crops}, {next_crops}
  # {particles_state}
  items:
    time:
      slot: 1
      action: UPGRADE_TIME
      material: CLOCK
      name: "&b&lMejora de Tiempo"
      lore:
        - "&8&m────────────────────"
        - "&7Nivel actual: &f{level}&8/&f{max_level}"
        - "&7Intervalo: &f{current_interval}s &8→ &a{next_interval}s"
        - "&7Costo: &e{cost}"
        - ""
        - "&e▸ Clic para mejorar"
        - "&8&m────────────────────"

    radius:
      slot: 3
      action: UPGRADE_RADIUS
      material: COMPASS
      name: "&a&lMejora de Radio"
      lore:
        - "&8&m────────────────────"
        - "&7Nivel actual: &f{level}&8/&f{max_level}"
        - "&7Radio: &f{current_radius} &8→ &a{next_radius}"
        - "&7Costo: &e{cost}"
        - ""
        - "&e▸ Clic para mejorar"
        - "&8&m────────────────────"

    crops:
      slot: 5
      action: UPGRADE_CROPS
      material: WHEAT
      name: "&e&lMejora de Cultivos"
      lore:
        - "&8&m────────────────────"
        - "&7Nivel actual: &f{level}&8/&f{max_level}"
        - "&7Cultivos en este tier: &f{next_crops}"
        - "&7Costo: &e{cost}"
        - ""
        - "&e▸ Clic para mejorar"
        - "&8&m────────────────────"

    particles:
      slot: 7
      action: TOGGLE_PARTICLES
      material: END_ROD
      name: "&d&lPartículas: &f{particles_state}"
      lore:
        - "&7Anillo horizontal alrededor del bloque."
        - ""
        - "&e▸ Clic para alternar"

  # Rellena los espacios vacíos. Puedes desactivarlo.
  filler:
    enabled: false
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    lore: []

messages:
  prefix: "&8[&aCropRegen&8] &r"
  placed: "&aBloque regenerador colocado correctamente."
  removed: "&cBloque regenerador eliminado."
  limit-reached: "&cHas alcanzado el límite de bloques para tu isla (&f{max}&c)."
  upgrade-success: "&aMejora de &e{tree} &acompletada. Nivel &e{level}&a."
  upgrade-max: "&eEsta mejora ya está en el nivel máximo."
  not-your-island: "&cSolo puedes colocar este bloque en tu isla."
  no-permission: "&cSolo el dueño puede administrar este regenerador."
  particles-toggled: "&aPartículas &e{state}&a."
  vault-unavailable: "&cVault/Economy no está disponible."
  not-enough-money: "&cNo tienes suficiente dinero. Necesitas &e{cost}&c."
  not-enough-xp: "&cNo tienes suficiente XP. Necesitas &e{cost}&c XP."
  not-enough-items: "&cNo tienes los objetos necesarios. Necesitas &e{cost}&c."
  payment-error: "&cNo se pudo completar el pago."
  item-given: "&aSe dio el bloque de nivel &e{level} &aa &f{player}&a."
  no-player: "&cJugador no encontrado."
  invalid-level: "&cNivel inválido. Usa un nivel entre 1 y {max}."
  cooldown-message: "&cEspera &e{seconds}s &cantes de volver a usar esto."

interaction:
  cooldown: 0

item:
  name: "&aRegenerador de Cultivos"
  lore:
    - "&r&8──────────────────"
    - "&r&7Nivel inicial: &e{level}"
    - "&r&7Radio: &a{radius} bloques"
    - "&r&7Intervalo: &e{interval}s"
    - ""
    - "&r&8Coloca este bloque en tu isla"
    - "&r&8──────────────────"
  enchanted: true
  hide-enchantments: true
